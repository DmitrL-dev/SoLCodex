name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate shell syntax
        run: bash -n scripts/install.sh scripts/build_release.sh
      - name: Validate JSON
        run: find .agents plugins -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Test hooks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s plugins/sol-codex/scripts -p 'test_*.py' -v
      - name: Smoke-test installed hook commands
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_installed_hooks -v
      - name: Test release tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_release_tools -v
      - name: Test A/B trace accounting
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_ab_trace.py' -v
      - name: Test OTel observation audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_audit_otel_usage.py' -v
      - name: Test proxy usage audit and attempt journal
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_audit_proxy_probe scripts.test_usage_attempt_ledger -v
      - name: Test candidate ranking gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_rank_confirm_candidates -v
      - name: Test clean development patch evaluator
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_evaluate_development_patch -v
      - name: Test model-request marker audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_audit_prehook_request_probe -v
      - name: Test projected candidate export
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install -r scripts/requirements-candidate-export.txt
          python -m unittest scripts.test_export_swe_rebench_metadata -v
      - name: Test explicit command receipt prototype
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_receipt_command.py' -v
      - name: Test bounded receipt artifact search
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_receipt_search.py' -v
      - name: Test cache-preserving upgrade
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_upgrade_cache -v
      - name: Run deterministic receipt benchmark
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/benchmark_receipts.py > "${RUNNER_TEMP}/sol-codex-benchmark.json"
      - name: Validate repository
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_repository.py
      - name: Build and inspect release
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: scripts/build_release.sh

  validate-legacy:
    runs-on: ${{ matrix.os }}
    env:
      PY_PYTHON3: "3.9"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Verify Python 3.9
        run: python -c "import sys; assert sys.version_info[:2] == (3, 9)"
      - name: Verify Windows launcher selects Python 3.9
        if: runner.os == 'Windows'
        run: py -3 -c "import sys; assert sys.version_info[:2] == (3, 9)"
      - name: Test hooks and Windows commands
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s plugins/sol-codex/scripts -p 'test_*.py' -v
      - name: Smoke-test installed hook commands
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_installed_hooks -v
      - name: Test A/B trace accounting
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_ab_trace.py' -v
      - name: Test OTel observation audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_audit_otel_usage.py' -v
      - name: Test proxy usage audit and attempt journal
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_audit_proxy_probe scripts.test_usage_attempt_ledger -v
      - name: Test candidate ranking gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_rank_confirm_candidates -v
      - name: Test explicit command receipt prototype
        if: runner.os != 'Windows'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_receipt_command.py' -v
      - name: Test bounded receipt artifact search
        if: runner.os != 'Windows'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_receipt_search.py' -v
      - name: Validate repository
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_repository.py

  validate-windows:
    runs-on: windows-latest
    env:
      PY_PYTHON3: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Windows launcher selects matrix Python
        run: py -3 -c "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['PY_PYTHON3']"
      - name: Test hooks and Windows commands
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s plugins/sol-codex/scripts -p 'test_*.py' -v
      - name: Smoke-test installed hook commands
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_installed_hooks -v
      - name: Test A/B trace accounting
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_ab_trace.py' -v
      - name: Test OTel observation audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts -p 'test_audit_otel_usage.py' -v
      - name: Test proxy usage audit and attempt journal
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_audit_proxy_probe scripts.test_usage_attempt_ledger -v
      - name: Test candidate ranking gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_rank_confirm_candidates -v
      - name: Validate repository
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_repository.py
