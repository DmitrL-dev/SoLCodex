name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate shell syntax
        run: bash -n scripts/install.sh scripts/build_release.sh
      - name: Validate JSON
        run: find .agents plugins -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
      - name: Test hooks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s plugins/sol-codex/scripts -p 'test_*.py' -v
      - name: Test release tools
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest scripts.test_release_tools -v
      - name: Run deterministic receipt benchmark
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/benchmark_receipts.py > "${RUNNER_TEMP}/sol-codex-benchmark.json"
      - name: Validate repository
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_repository.py
      - name: Build and inspect release
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: scripts/build_release.sh

  validate-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test hooks and Windows commands
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s plugins/sol-codex/scripts -p 'test_*.py' -v
      - name: Validate repository
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_repository.py
