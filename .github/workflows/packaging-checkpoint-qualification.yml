name: Packaging checkpoint development qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/packaging-checkpoint-qualification.yml
      - experiments/packaging_checkpoint/**
      - experiments/packaging_928/verify_packaging_frozen.py

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check complete-checkout snapshot and worker controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest experiments.packaging_checkpoint.test_snapshot experiments.packaging_checkpoint.test_run experiments.packaging_checkpoint.test_verify_installed -v
      - name: Recheck disposable Linux containment controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 experiments/linux_worker_preflight/run.py --output "$RUNNER_TEMP/sol-packaging-containment.json"
      - name: Run stopped-worker packaging checkpoint qualification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m experiments.packaging_checkpoint.run --output "$RUNNER_TEMP/sol-packaging-checkpoint.json"
